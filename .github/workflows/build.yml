name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Merge into single flashable .bin
        continue-on-error: true
        run: |
          B=.pio/build/ttgo-t-display
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          ESPTOOL=$(find ~/.platformio/packages -path '*tool-esptoolpy*' -name esptool.py | head -1)
          python "$ESPTOOL" --chip esp32 merge_bin \
            -o ds4-bluepad32-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT" \
            0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ds4-bluepad32-ttgo
          if-no-files-found: warn
          path: |
            ds4-bluepad32-merged.bin
            .pio/build/ttgo-t-display/firmware.bin
